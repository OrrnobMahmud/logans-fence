<x-dc>

    <div style="position:relative;max-width:1280px;width:100%;margin:0 auto;padding:180px 24px 72px;">
      <div data-reveal="up" style="display:flex;gap:10px;align-items:center;font-size:13px;color:#cfc6b8;"><a href="/" style="color:#cfc6b8;text-decoration:none;">Home</a><span>/</span><span style="color:#e2a86c;">Gallery</span></div>

<script type="text/x-dc" data-dc-script>
const PHOTOS = [
  { src: 'assets/g1.jpg', w: 1800, h: 1350, title: 'Horizontal pool fence', cat: 'wood' },
  { src: 'assets/p1.jpg', w: 960, h: 774, title: 'Iron gate with Texas star', cat: 'gates' },
  { src: 'assets/p3.jpg', w: 1800, h: 1350, title: 'Cedar privacy fence', cat: 'wood' },
  { src: 'assets/p2.jpg', w: 1800, h: 1800, title: 'Cedar pergola', cat: 'pergolas' },
  { src: 'assets/g2.jpg', w: 1800, h: 1350, title: 'Stained board-on-board fence', cat: 'wood' },
  { src: 'assets/p4.jpg', w: 960, h: 720, title: 'Wrought iron fence', cat: 'iron' },
  { src: 'assets/about.jpg', w: 1800, h: 1350, title: 'Horizontal cedar fence', cat: 'wood' },
  { src: 'assets/g3.jpg', w: 960, h: 811, title: 'Wood & steel sliding gate', cat: 'gates' },
  { src: 'assets/why.jpg', w: 1800, h: 1350, title: 'Dark-stained privacy fence', cat: 'wood' }
];
const FILTERS = [['all', 'All'], ['wood', 'Wood'], ['iron', 'Iron'], ['gates', 'Gates'], ['pergolas', 'Pergolas']];
class Component extends DCLogic {
  state = { f: 'all', idx: -1 };
  _lastF = 'all';
  componentDidMount() {
    const go = () => (window.LF ? window.LF.init() : setTimeout(go, 60));
    go();
    this.onKey = (e) => {
      if (this.state.idx < 0) return;
      if (e.key === 'Escape') this.setState({ idx: -1 });
      if (e.key === 'ArrowRight') this.step(1);
      if (e.key === 'ArrowLeft') this.step(-1);
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  componentDidUpdate() {
    if (this._lastF !== this.state.f) { this._lastF = this.state.f; if (window.LF) setTimeout(window.LF.rescan, 30); }
  }
  list() { return this.state.f === 'all' ? PHOTOS : PHOTOS.filter(p => p.cat === this.state.f); }
  step(d) { const n = this.list().length; this.setState(s => ({ idx: (s.idx + d + n) % n })); }
  renderVals() {
    const list = this.list();
    const cur = list[this.state.idx];
    return {
      filters: FILTERS.map(([k, label]) => {
        const on = k === this.state.f;
        return { label, count: k === 'all' ? PHOTOS.length : PHOTOS.filter(p => p.cat === k).length, bg: on ? '#211f1d' : 'transparent', color: on ? '#fff' : '#211f1d', border: on ? '#211f1d' : '#d9cbb7', pick: () => this.setState({ f: k, idx: -1 }) };
      }),
      shown: list.map((p, i) => ({ ...p, open: () => this.setState({ idx: i }) })),
      lightbox: !!cur,
      cur: cur ? { ...cur, pos: `${this.state.idx + 1} / ${list.length}` } : { src: '', title: '', pos: '' },
      boxImg: cur ? React.createElement('img', { key: cur.src, src: cur.src, alt: cur.title, onClick: (e) => e.stopPropagation(), style: { maxWidth: '100%', maxHeight: '100%', borderRadius: 16, boxShadow: '0 40px 80px rgba(0,0,0,.6)' } }) : null,
      closeBox: () => this.setState({ idx: -1 }),
      prev: (e) => { e.stopPropagation(); this.step(-1); },
      next: (e) => { e.stopPropagation(); this.step(1); }
    };
  }
}
</script>
